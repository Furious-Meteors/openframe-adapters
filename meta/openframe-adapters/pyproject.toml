[build-system]  
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openframe-adapters"
version = "2.0.2"
description = "OpenFrame Microservice Suite - adapter meta-package. Install adapters by name or group."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = [
    "openframe",
    "hexagonal",
    "microservice",
    "postgres",
    "mongodb",
    "redis",
    "kafka",
    "vector-database",
    "adapter",
    "fastapi",
    "modal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres   = ["openframe-adapters-db-postgres>=2.0,<3"]
mysql      = ["openframe-adapters-db-mysql>=1.1,<2"]
redis      = ["openframe-adapters-db-redis>=2.0,<3"]
dynamodb   = ["openframe-adapters-db-dynamodb>=1.1,<2"]
mongo      = ["openframe-adapters-db-mongo>=2.0,<3"]
cassandra  = ["openframe-adapters-db-cassandra>=1.1,<2"]
influxdb   = ["openframe-adapters-db-influxdb>=1.1,<2"]
milvus     = ["openframe-adapters-db-milvus>=1.1,<2"]
chromadb   = ["openframe-adapters-db-chromadb>=1.1,<2"]
qdrant     = ["openframe-adapters-db-qdrant>=1.1,<2"]
faiss      = ["openframe-adapters-db-faiss>=1.1,<2"]
falkordb   = ["openframe-adapters-db-falkordb>=1.1,<2"]
kafka      = ["openframe-adapters-queue-kafka>=1.4,<2"]
nats       = ["openframe-adapters-queue-nats>=1.1,<2"]
rabbitmq   = ["openframe-adapters-queue-rabbitmq>=1.1,<2"]
db = [
    "openframe-adapters[postgres]",
    "openframe-adapters[mysql]",
    "openframe-adapters[redis]",
    "openframe-adapters[dynamodb]",
    "openframe-adapters[mongo]",
    "openframe-adapters[cassandra]",
    "openframe-adapters[influxdb]",
]
vector = [
    "openframe-adapters[milvus]",
    "openframe-adapters[chromadb]",
    "openframe-adapters[qdrant]",
    "openframe-adapters[faiss]",
    "openframe-adapters[falkordb]",
]
queue = [
    "openframe-adapters[kafka]",
    "openframe-adapters[nats]",
    "openframe-adapters[rabbitmq]",
]
all = [
    "openframe-adapters[db]",
    "openframe-adapters[vector]",
    "openframe-adapters[queue]",
]
rest-min     = ["openframe-adapters[postgres]", "openframe-adapters[redis]"]
rag-stack    = ["openframe-adapters[milvus]", "openframe-adapters[falkordb]", "openframe-adapters[redis]"]
research-min = ["openframe-adapters[mongo]", "openframe-adapters[redis]"]

[[project.authors]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[[project.maintainers]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-adapters"
Documentation = "https://furious-meteors.github.io/openframe-adapters/"
Repository    = "https://github.com/Furious-Meteors/openframe-adapters"
Changelog     = "https://github.com/Furious-Meteors/openframe-adapters/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-adapters/issues"

# setuptools with empty find — the correct approach for metadata-only packages.
# hatchling does not support packages=[] cleanly; flit-core requires a module.
# setuptools with include=[] produces a valid wheel containing only dist-info.
[tool.setuptools.packages.find]
where = ["."]
include = []
