[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-adapters"
version = "1.0.0"
description = "OpenFrame Microservice Suite — adapter meta-package. Install adapters by name or group."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Amritanshu Pandey", email = "amritanshupandey.meritocrat@gmail.com"" },
]
maintainers = [
    { name = "Amritanshu Pandey", email = "amritanshupandey.meritocrat@gmail.com"" },
]

keywords = [
    "openframe",
    "hexagonal",
    "microservice",
    "postgres",
    "mongodb",
    "redis",
    "kafka",
    "vector-database",
    "adapter",
    "fastapi",
    "modal",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-adapters"
Documentation = "https://furious-meteors.github.io/openframe-adapters/"
Repository    = "https://github.com/Furious-Meteors/openframe-adapters"
Changelog     = "https://github.com/Furious-Meteors/openframe-adapters/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-adapters/issues"

# The meta-package has no runtime dependencies of its own.
# openframe-core is a transitive dependency through every individual adapter package.
dependencies = []

[project.optional-dependencies]

# ── Individual adapters ────────────────────────────────────────────────────
postgres   = ["openframe-adapters-db-postgres>=1.0,<2"]
mysql      = ["openframe-adapters-db-mysql>=1.0,<2"]
redis      = ["openframe-adapters-db-redis>=1.0,<2"]
dynamodb   = ["openframe-adapters-db-dynamodb>=1.0,<2"]
mongo      = ["openframe-adapters-db-mongo>=1.0,<2"]
cassandra  = ["openframe-adapters-db-cassandra>=1.0,<2"]
influxdb   = ["openframe-adapters-db-influxdb>=1.0,<2"]
milvus     = ["openframe-adapters-db-milvus>=1.0,<2"]
chromadb   = ["openframe-adapters-db-chromadb>=1.0,<2"]
qdrant     = ["openframe-adapters-db-qdrant>=1.0,<2"]
faiss      = ["openframe-adapters-db-faiss>=1.0,<2"]
falkordb   = ["openframe-adapters-db-falkordb>=1.0,<2"]
kafka      = ["openframe-adapters-queue-kafka>=1.0,<2"]
nats       = ["openframe-adapters-queue-nats>=1.0,<2"]
rabbitmq   = ["openframe-adapters-queue-rabbitmq>=1.0,<2"]

# ── Group extras ───────────────────────────────────────────────────────────
db = [
    "openframe-adapters[postgres]",
    "openframe-adapters[mysql]",
    "openframe-adapters[redis]",
    "openframe-adapters[dynamodb]",
    "openframe-adapters[mongo]",
    "openframe-adapters[cassandra]",
    "openframe-adapters[influxdb]",
]
vector = [
    "openframe-adapters[milvus]",
    "openframe-adapters[chromadb]",
    "openframe-adapters[qdrant]",
    "openframe-adapters[faiss]",
    "openframe-adapters[falkordb]",
]
queue = [
    "openframe-adapters[kafka]",
    "openframe-adapters[nats]",
    "openframe-adapters[rabbitmq]",
]
all = [
    "openframe-adapters[db]",
    "openframe-adapters[vector]",
    "openframe-adapters[queue]",
]

# ── Convenience bundles ────────────────────────────────────────────────────
rest-min     = ["openframe-adapters[postgres]", "openframe-adapters[redis]"]
rag-stack    = ["openframe-adapters[milvus]", "openframe-adapters[falkordb]", "openframe-adapters[redis]"]
research-min = ["openframe-adapters[mongo]", "openframe-adapters[redis]"]

[tool.hatch.build.targets.wheel]
# No Python source — metadata-only package.
packages = []