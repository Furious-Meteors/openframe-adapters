name: App Testing

on:
  pull_request:
    branches:
      - dev
      - production

  # Callable from other workflows (e.g. python-build.yml runs tests before publish).
  workflow_call:

jobs:
  test:
    name: "${{ matrix.package }} — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      # false: run all matrix combinations even if one fails.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package:
          - openframe-adapters-db-postgres
          - openframe-adapters-db-mongo
          - openframe-adapters-db-redis
          - openframe-adapters-queue-kafka

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true   # required if 3.14 is still RC on the runner
          cache: pip

      - name: Install ${{ matrix.package }} with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
