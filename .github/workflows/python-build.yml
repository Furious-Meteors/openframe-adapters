name: Build & Publish Python Packages

on:
  push:
    branches:
      - production

  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    uses: ./.github/workflows/app-test.yml

  release:
    name: Release ${{ matrix.package }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/openframe-adapters-db-mongo
          - packages/openframe-adapters-db-postgres
          - packages/openframe-adapters-db-redis
          - packages/openframe-adapters-queue-kafka
          - meta/openframe-adapters

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -lh dist/

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
