name: Build & Publish Python Packages

on:
  push:
    branches:
      - production

  workflow_dispatch:

jobs:
  release:
    name: Release ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/openframe-adapters-db-mongo
          - packages/openframe-adapters-db-postgres
          - packages/openframe-adapters-db-redis
          - packages/openframe-adapters-queue-kafka
          - meta/openframe-adapters

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── Test ──────────────────────────────────────────────────────────────
      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d "tests" ]; then
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests/ directory — test phase skipped for this package."
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -lh dist/

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          skip-existing: true
