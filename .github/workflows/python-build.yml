name: Build & Publish Python Packages

on:
  push:
    branches:
      - production

  workflow_dispatch:

  # Automatic re-trigger for PyPI's new-project-creation quota (see the
  # release job's own strategy comment below for the full explanation).
  # This is NOT a retry-on-failure mechanism — it does not re-run inside
  # the same attempt, which is exactly what risks burning the rest of a
  # day's quota on doomed retries. It is a once-daily, fully independent
  # re-run of the whole pipeline (tests included), scheduled far enough
  # apart that the quota has had a real chance to reset between
  # attempts. skip-existing: true makes every run safe to repeat —
  # packages that already published are free no-op skips; only the
  # still-unpublished new packages actually attempt anything.
  #
  # Remove this schedule block once every package in the release matrix
  # has confirmed-published at least once — its only purpose is working
  # through the current backlog of brand-new, never-before-published
  # project names. Leaving it running forever after that point just
  # burns CI minutes on a job that will only ever no-op.
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily

jobs:
  test:
    name: Run test suite
    uses: ./.github/workflows/app-test.yml

  release:
    name: Release ${{ matrix.package }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # max-parallel: 1 — this is NOT the same 429 the comment below used
      # to describe. PyPI returns a DIFFERENT error, "429 Too many new
      # projects created", which is an anti-abuse quota on first-time
      # publishes of brand-new project names — observed (pypi/support,
      # pypi/warehouse issue trackers) to lock out after roughly 4-8 new
      # projects in one burst, REGARDLESS of concurrency. This repo has
      # 13 never-before-published package names in this matrix, well past
      # that threshold. Concurrency batching cannot fix a cross-request
      # account quota — serializing to 1 only avoids making it worse by
      # firing several new-project attempts in the same instant.
      #
      # DO NOT add automatic retry-on-429 here. Confirmed from real
      # incident reports: a failed/rolled-back new-project upload still
      # spends a quota hit, so retrying a 429 can burn the rest of a
      # day's quota without ever succeeding. If this job fails with
      # "Too many new projects created":
      #   1. Do nothing automatic — wait. Already-published packages are
      #      unaffected on the next run (skip-existing: true below), and
      #      this quota only ever applies to a project's FIRST publish —
      #      once a package has published once, it never hits this again.
      #   2. For a faster one-time fix, file a "Limit Request" issue at
      #      https://github.com/pypi/support/issues (the documented,
      #      sanctioned path other projects use for exactly this —
      #      a coordinated monorepo release with many new projects at
      #      once) asking for a temporary lift tied to this repository.
      max-parallel: 1
      matrix:
        package:
          - packages/openframe-adapters-db-mongo
          - packages/openframe-adapters-db-postgres
          - packages/openframe-adapters-db-redis
          - packages/openframe-adapters-db-cockroachdb
          - packages/openframe-adapters-db-mysql
          - packages/openframe-adapters-db-mariadb
          - packages/openframe-adapters-db-oracle
          - packages/openframe-adapters-db-dynamodb
          - packages/openframe-adapters-db-cassandra
          - packages/openframe-adapters-db-influxdb
          - packages/openframe-adapters-queue-kafka
          - packages/openframe-adapters-queue-nats
          - packages/openframe-adapters-queue-rabbitmq
          - packages/openframe-adapters-db-qdrant
          - packages/openframe-adapters-db-milvus
          - packages/openframe-adapters-db-chromadb
          - packages/openframe-adapters-db-falkordb
          - meta/openframe-adapters

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe

    # PyPI Trusted Publishing (OIDC) — no long-lived API token required,
    # once configured. Each package needs its own trusted publisher entry
    # (one per PyPI project), configured at:
    #   https://pypi.org/manage/project/<package-name>/settings/publishing/
    # with:
    #   Owner:    <your GitHub org/user>
    #   Repo:     openframe-adapters
    #   Workflow: python-build.yml
    #   Env:      pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -lh dist/

      # ── Publish ───────────────────────────────────────────────────────────
      # Phase 1 (new package): PYPI_API_TOKEN org secret present → token auth.
      # Phase 2 (established package): trusted publisher configured on PyPI →
      #   OIDC auth; the action ignores the token once OIDC takes precedence.
      # Same workflow file per package, no edits needed when transitioning
      # between phases — matches openframe-core's own python-build.yml.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false
