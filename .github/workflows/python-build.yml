name: Build & Publish Python Packages

on:
  push:
    branches:
      - production

  workflow_dispatch:
    inputs:
      package_path:
        description: |
          Path to the package directory, e.g:
            packages/openframe-adapters-db-postgres
            meta/openframe-adapters
        required: true
        type: string

jobs:
  # ── 1. Detect which packages changed ─────────────────────────────────────
  detect:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — required for reliable diff

      - name: Detect changed packages
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # ── Manual trigger ──────────────────────────────────────────────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.package_path }}"
            INPUT="${INPUT%/}"   # strip trailing slash

            if [ ! -f "${INPUT}/pyproject.toml" ]; then
              echo "ERROR: ${INPUT}/pyproject.toml not found"
              exit 1
            fi

            PACKAGES=$(jq -nc --arg p "$INPUT" '[$p]')
            echo "Manual trigger — package: ${INPUT}"

          # ── Automatic push trigger ──────────────────────────────────────
          else
            # Check whether a parent commit exists.
            # On the very first push to a branch HEAD~1 does not exist.
            if git rev-parse --verify HEAD~1 > /dev/null 2>&1; then
              # Normal case — diff against parent commit
              CHANGED=$(git diff --name-only HEAD~1 HEAD \
                | grep -E '^(packages|meta)/' \
                | awk -F/ '{print $1"/"$2}' \
                | sort -u || true)
              echo "Diff mode: HEAD~1..HEAD"
            else
              # First commit on this branch — treat all packages/ and meta/ as changed
              echo "First commit detected — scanning all packages and meta dirs"
              CHANGED=$(find packages meta -maxdepth 1 -mindepth 1 -type d 2>/dev/null \
                | sort -u || true)
            fi

            echo "Changed directories:"
            echo "${CHANGED:-<none>}"

            # Filter to dirs that have a pyproject.toml
            VALID_JSON='[]'
            while IFS= read -r dir; do
              [ -z "$dir" ] && continue
              if [ -f "${dir}/pyproject.toml" ]; then
                VALID_JSON=$(echo "$VALID_JSON" | jq --arg d "$dir" '. + [$d]')
                echo "  ✓ ${dir}"
              else
                echo "  ✗ ${dir} (no pyproject.toml — skipping)"
              fi
            done <<< "$CHANGED"

            PACKAGES="$VALID_JSON"
          fi

          # ── Output ───────────────────────────────────────────────────────
          echo "Packages to process: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

          COUNT=$(echo "$PACKAGES" | jq 'length')
          if [ "$COUNT" = "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No packages to process."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Found ${COUNT} package(s) to process."
          fi

  # ── 2. Test each changed package ─────────────────────────────────────────
  test:
    name: Test ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if package has tests
        id: has_tests
        run: |
          if [ -d "${{ matrix.package }}/tests" ]; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
            echo "Found tests/ — will run test suite"
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
            echo "No tests/ directory — meta-package, skipping tests"
          fi

      - name: Setup Python
        if: steps.has_tests.outputs.run_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        if: steps.has_tests.outputs.run_tests == 'true'
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        if: steps.has_tests.outputs.run_tests == 'true'
        working-directory: ${{ matrix.package }}
        run: pytest tests/ -v --tb=short

  # ── 3. Build each changed package ────────────────────────────────────────
  build:
    name: Build ${{ matrix.package }}
    needs: [detect, test]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Read package metadata
        id: pkg_meta
        working-directory: ${{ matrix.package }}
        run: |
          NAME=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field name)
          VERSION=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field version)
          SAFE=$(echo "$NAME" | tr '.' '-')
          echo "name=$NAME"           >> $GITHUB_OUTPUT
          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "artifact_label=$SAFE" >> $GITHUB_OUTPUT
          echo "Building: $NAME==$VERSION"

      - name: Build wheel and sdist
        working-directory: ${{ matrix.package }}
        run: python -m build

      - name: Show built artifacts
        working-directory: ${{ matrix.package }}
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.pkg_meta.outputs.artifact_label }}
          path: ${{ matrix.package }}/dist/
          retention-days: 7

  # ── 4. Publish each changed package to PyPI ──────────────────────────────
  publish:
    name: Publish ${{ matrix.package }}
    needs: [detect, build]
    if: |
      needs.detect.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read artifact label
        id: pkg_meta
        working-directory: ${{ matrix.package }}
        run: |
          NAME=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field name)
          SAFE=$(echo "$NAME" | tr '.' '-')
          echo "artifact_label=$SAFE" >> $GITHUB_OUTPUT
          echo "name=$NAME"           >> $GITHUB_OUTPUT
          echo "Publishing: $NAME"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ steps.pkg_meta.outputs.artifact_label }}
          path: dist/

      - name: Show artifacts to be published
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  # ── 5. Pipeline summary ───────────────────────────────────────────────────
  summary:
    name: Summary
    needs: [detect, test, build, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write job summary
        run: |
          PACKAGES='${{ needs.detect.outputs.packages }}'

          echo "## openframe-adapters Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages processed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "$PACKAGES" | jq -r '.[]' | while read pkg; do
            if [ -f "${pkg}/pyproject.toml" ]; then
              cd "${pkg}"
              NAME=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field name 2>/dev/null || echo "$pkg")
              VER=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field version 2>/dev/null || echo "?")
              cd "${{ github.workspace }}"
              echo "- \`${NAME}==${VER}\` — [pypi.org/project/${NAME}](https://pypi.org/project/${NAME}/)" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect  | ${{ needs.detect.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test    | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build   | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY