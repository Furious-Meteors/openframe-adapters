name: Build & Publish Python Packages

on:
  push:
    branches:
      - production

  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild every package under packages/ and meta/ (ignores package_path)"
        required: false
        default: false
        type: boolean
      package_path:
        description: |
          One or more package directories, one per line (ignored when rebuild_all is checked):
            packages/openframe-adapters-db-mongo
            packages/openframe-adapters-db-postgres
            packages/openframe-adapters-queue-kafka
            meta/openframe-adapters
        required: false
        type: string

jobs:
  # ── 1. Detect which packages changed ─────────────────────────────────────
  detect:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — required for reliable diff

      - name: Detect changed packages
        id: detect
        shell: bash
        run: |
          # Do NOT use set -e here — grep/find exit 1 on no matches
          # which would kill the step before writing outputs.

          VALID_JSON='[]'

          # ── Helper: append dir to VALID_JSON if it has a pyproject.toml ──
          add_if_valid() {
            local dir="${1%/}"
            [ -z "$dir" ] && return
            if [ -f "${dir}/pyproject.toml" ]; then
              VALID_JSON=$(jq -nc --argjson arr "$VALID_JSON" --arg d "$dir" \
                '$arr + [$d]')
              echo "  ✓ ${dir}"
            else
              echo "  ✗ ${dir} (no pyproject.toml — skipping)"
            fi
          }

          # ── Manual trigger ────────────────────────────────────────────────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            if [ "${{ inputs.rebuild_all }}" = "true" ]; then
              echo "rebuild_all=true — scanning all packages/ and meta/ dirs:"
              while IFS= read -r dir; do
                add_if_valid "$dir"
              done < <(find packages meta -maxdepth 1 -mindepth 1 -type d \
                2>/dev/null | sort -u)

            else
              echo "Manual trigger — parsing package_path input (one per line):"
              if [ -z "${{ inputs.package_path }}" ]; then
                echo "ERROR: package_path is empty and rebuild_all is false."
                exit 1
              fi
              while IFS= read -r line; do
                line="${line#"${line%%[![:space:]]*}"}"
                line="${line%"${line##*[![:space:]]}"}"
                [ -z "$line" ] && continue
                add_if_valid "$line"
              done <<< "${{ inputs.package_path }}"
            fi

          # ── Automatic push trigger ────────────────────────────────────────
          else
            # Diff the full push range so every commit in the push is covered.
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
               ! git rev-parse --verify "$BEFORE" > /dev/null 2>&1; then
              echo "First push or shallow clone — scanning all packages/ and meta/ dirs"
              CHANGED=$(find packages meta -maxdepth 1 -mindepth 1 -type d \
                2>/dev/null | sort -u || true)
            else
              echo "Diff mode: ${BEFORE}..${AFTER}"
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" \
                | grep -E '^(packages|meta)/' \
                | awk -F/ '{print $1"/"$2}' \
                | sort -u || true)
            fi

            echo "Changed directories detected:"
            echo "${CHANGED:-<none>}"

            while IFS= read -r dir; do
              add_if_valid "$dir"
            done <<< "$CHANGED"
          fi

          echo "Final packages JSON: $VALID_JSON"
          echo "packages=$VALID_JSON" >> "$GITHUB_OUTPUT"

          COUNT=$(jq 'length' <<< "$VALID_JSON")
          echo "Package count: $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No packages to process — downstream jobs will be skipped."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT package(s) — downstream jobs will run."
          fi

  # ── 2. Test → Build → Publish (one job per package, fully independent) ───
  #
  # Combining all three phases into a single matrix job means one package's
  # test failure cannot block another package's build or publish. Each
  # package succeeds or fails on its own.
  release:
    name: Release ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── Test (skipped for meta-packages with no tests/ dir) ──────────────
      - name: Check for tests
        id: has_tests
        run: |
          if [ -d "${{ matrix.package }}/tests" ]; then
            echo "run_tests=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "No tests/ directory — skipping test phase."
          fi

      - name: Install package + dev dependencies
        if: steps.has_tests.outputs.run_tests == 'true'
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        if: steps.has_tests.outputs.run_tests == 'true'
        working-directory: ${{ matrix.package }}
        run: python -m pytest tests/ -v --tb=short

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Read package metadata
        id: pkg_meta
        working-directory: ${{ matrix.package }}
        run: |
          NAME=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field name)
          VERSION=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" --field version)
          SAFE=$(echo "$NAME" | tr '.' '-')
          echo "name=$NAME"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "artifact_label=$SAFE" >> "$GITHUB_OUTPUT"
          echo "Building: $NAME==$VERSION"

      - name: Build wheel and sdist
        working-directory: ${{ matrix.package }}
        run: python -m build

      - name: Show built artifacts
        working-directory: ${{ matrix.package }}
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.pkg_meta.outputs.artifact_label }}
          path: ${{ matrix.package }}/dist/
          retention-days: 7

      # ── Publish (production branch only) ─────────────────────────────────
      - name: Publish to PyPI
        if: github.ref == 'refs/heads/production'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          skip-existing: true

  # ── 3. Pipeline summary ───────────────────────────────────────────────────
  summary:
    name: Summary
    needs: [detect, release]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write job summary
        run: |
          PACKAGES='${{ needs.detect.outputs.packages }}'

          echo "## openframe-adapters Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`  " >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Packages processed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "$PACKAGES" | jq -r '.[]' | while read -r pkg; do
            if [ -f "${pkg}/pyproject.toml" ]; then
              cd "${pkg}"
              NAME=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" \
                --field name 2>/dev/null || echo "$pkg")
              VER=$(python3 "${{ github.workspace }}/scripts/read_pkg_meta.py" \
                --field version 2>/dev/null || echo "?")
              cd "${{ github.workspace }}"
              echo "- \`${NAME}==${VER}\` — [pypi.org/project/${NAME}](https://pypi.org/project/${NAME}/)" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Job results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job    | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detect  | ${{ needs.detect.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
