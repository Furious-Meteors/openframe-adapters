name: Build & Publish Python Packages

# Triggers on every push to production.
# Detects which packages/meta directories changed.
# Builds and publishes only those — unchanged packages are never touched.
on:
  push:
    branches:
      - production

  # Manual trigger for a specific package
  workflow_dispatch:
    inputs:
      package_path:
        description: |
          Path to the package directory, e.g:
            packages/openframe-adapters-db-postgres
            packages/openframe-adapters-db-mongo
            meta/openframe-adapters
        required: true
        type: string

jobs:
  # ── 1. Detect which packages changed ─────────────────────────────────────
  #
  # Watches two directory roots:
  #   packages/  — individual adapter packages (openframe-adapters-db-postgres etc.)
  #   meta/      — meta-packages (openframe-adapters, openframe-suite)
  #
  # Output: JSON array of directory paths that contain a changed pyproject.toml
  # Example: ["packages/openframe-adapters-db-postgres", "meta/openframe-adapters"]
  detect:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.package_path }}"
            INPUT="${INPUT%/}"
            if [ ! -f "${INPUT}/pyproject.toml" ]; then
              echo "ERROR: ${INPUT}/pyproject.toml not found"
              exit 1
            fi
            PACKAGES=$(jq -nc --arg p "$INPUT" '[$p]')
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^(packages|meta)/' \
              | awk -F/ '{print $1"/"$2}' \
              | sort -u \
              || true)

            echo "Changed directories:"
            echo "$CHANGED"

            VALID_JSON='[]'
            while IFS= read -r dir; do
              [ -z "$dir" ] && continue
              if [ -f "${dir}/pyproject.toml" ]; then
                VALID_JSON=$(echo "$VALID_JSON" | jq --arg d "$dir" '. + [$d]')
              fi
            done <<< "$CHANGED"

            PACKAGES="$VALID_JSON"
          fi

          echo "Packages to process: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

          COUNT=$(echo "$PACKAGES" | jq 'length')
          if [ "$COUNT" = "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # ── 2. Test each changed package ─────────────────────────────────────────
  #
  # Meta-packages have no code and no tests — detected and skipped.
  # Individual packages under packages/ always have a tests/ directory.
  test:
    name: Test ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if package has tests
        id: has_tests
        run: |
          if [ -d "${{ matrix.package }}/tests" ]; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
            echo "No tests/ directory — meta-package, skipping tests"
          fi

      - name: Setup Python
        if: steps.has_tests.outputs.run_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        if: steps.has_tests.outputs.run_tests == 'true'
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        if: steps.has_tests.outputs.run_tests == 'true'
        working-directory: ${{ matrix.package }}
        run: pytest tests/ -v --tb=short

  # ── 3. Build each changed package ────────────────────────────────────────
  #
  # Runs python -m build inside each changed directory.
  # Works identically for individual packages and meta-packages.
  #
  # Individual package example output:
  #   openframe_adapters_db_postgres-1.0.0-py3-none-any.whl
  #
  # Meta-package example output:
  #   openframe_adapters-1.0.0-py3-none-any.whl
  #   (tiny wheel — just metadata + extras declarations, no Python code)
  #
  # Install surface produced by the meta-package:
  #   pip install openframe-adapters[postgres]   → openframe-adapters-db-postgres
  #   pip install openframe-adapters[db]         → all 12 DB adapters
  #   pip install openframe-adapters[all]        → all 15 adapters
  build:
    name: Build ${{ matrix.package }}
    needs: [detect, test]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Read package name and version from pyproject.toml
        id: pkg_meta
        working-directory: ${{ matrix.package }}
        run: |
          NAME=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['name'])
          ")
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          # Safe artifact label — hyphens only, no dots
          SAFE=$(echo "$NAME" | tr '.' '-')
          echo "name=$NAME"       >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_label=$SAFE" >> $GITHUB_OUTPUT
          echo "Building: $NAME==$VERSION from ${{ matrix.package }}"

      - name: Build wheel and sdist
        working-directory: ${{ matrix.package }}
        run: python -m build

      - name: Show built artifacts
        working-directory: ${{ matrix.package }}
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.pkg_meta.outputs.artifact_label }}
          path: ${{ matrix.package }}/dist/
          retention-days: 7

  # ── 4. Publish each changed package to PyPI ──────────────────────────────
  #
  # Each matrix leg publishes one PyPI package independently.
  # skip_existing: true means workflow retries never fail on already-published versions.
  #
  # PyPI packages published by this workflow (examples):
  #
  #   packages/openframe-adapters-db-postgres  →  openframe-adapters-db-postgres
  #   packages/openframe-adapters-db-mongo     →  openframe-adapters-db-mongo
  #   packages/openframe-adapters-db-redis     →  openframe-adapters-db-redis
  #   meta/openframe-adapters                  →  openframe-adapters
  #                                               (enables pip install openframe-adapters[postgres])
  #                                               (enables pip install openframe-adapters[db])
  #                                               (enables pip install openframe-adapters[all])
  #
  # Trusted Publishing setup (per package, one-time):
  #   https://pypi.org/manage/project/<name>/settings/publishing/
  #   Owner:    Furious-Meteors
  #   Repo:     openframe-adapters
  #   Workflow: python-build.yml
  #   Env:      pypi
  publish:
    name: Publish ${{ matrix.package }}
    needs: [detect, build]
    if: |
      needs.detect.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe-adapters

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read artifact label from pyproject.toml
        id: pkg_meta
        working-directory: ${{ matrix.package }}
        run: |
          NAME=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['name'])
          ")
          SAFE=$(echo "$NAME" | tr '.' '-')
          echo "artifact_label=$SAFE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Publishing: $NAME"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ steps.pkg_meta.outputs.artifact_label }}
          path: dist/

      - name: Show artifacts to be published
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  # ── 5. Pipeline summary ───────────────────────────────────────────────────
  summary:
    name: Summary
    needs: [detect, test, build, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write job summary
        run: |
          PACKAGES='${{ needs.detect.outputs.packages }}'

          echo "## openframe-adapters Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Packages processed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "$PACKAGES" | jq -r '.[]' | while read pkg; do
            if [ -f "${pkg}/pyproject.toml" ]; then
              NAME=$(python3 -c "
          import tomllib
          with open('${pkg}/pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['name'])
              " 2>/dev/null || echo "$pkg")
              VER=$(python3 -c "
          import tomllib
          with open('${pkg}/pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
              " 2>/dev/null || echo "?")
              echo "- \`${NAME}==${VER}\` — [pypi.org/project/${NAME}](https://pypi.org/project/${NAME}/)" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect  | ${{ needs.detect.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test    | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build   | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY