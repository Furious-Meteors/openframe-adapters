[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-adapters-db-mongo"
version = "1.0.0"
description = "OpenFrame Microservice Suite — MongoDB document store adapter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["openframe", "mongodb", "motor", "hexagonal", "microservice", "document-store"]
dependencies = [
    "openframe-core>=1.0,<2",
    "motor>=3.3",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
